apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-result
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-result
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-result
    spec:
      containers:
        - name: result
          image: ghcr.io/stormyayo/example-voting-app-result:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_HOST
              value: {{ printf "%s-postgres" .Release.Name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voting-postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-result
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-result
  ports:
    - name: http
      port: {{ .Values.result.servicePort }}
      targetPort: http