apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vote
spec:
  replicas: {{ .Values.vote.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-vote
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-vote
    spec:
      containers:
        - name: vote
          image: ghcr.io/stormyayo/example-voting-app-vote:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: REDIS_HOST
              value: {{ printf "%s-redis" .Release.Name | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vote
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-vote
  ports:
    - name: http
      port: {{ .Values.vote.servicePort }}
      targetPort: http