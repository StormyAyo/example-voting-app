
name: Voting App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Show running services
        run: docker compose ps

      - name: Smoke test Vote and Result pages
        shell: bash
        run: |
          set -eu

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://localhost:8080/ >/dev/null 2>&1 &&
               curl --fail --silent --show-error \
              http://localhost:8081/ >/dev/null 2>&1; then
              echo "PASS: Vote and Result pages responded successfully."
              exit 0
            fi

            echo "Waiting for the application pages... ($attempt/60)"
            sleep 2
          done

          echo "FAIL: Vote or Result page did not respond in time."
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Show logs if a test fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test environment
        if: always()
        run: docker compose down -v


  build_scan_push:
    name: Build, scan and publish images
    needs: test

    # Publish only when code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - vote
          - result
          - worker
          - seed-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f "${{ matrix.service }}/Dockerfile" \
            -t "local/voting-${{ matrix.service }}:${GITHUB_SHA}" \
            "./${{ matrix.service }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/voting-${{ matrix.service }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image using commit SHA
        run: |
          OWNER_REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_REPO}-${{ matrix.service }}"

          docker tag \
            "local/voting-${{ matrix.service }}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}"

          docker push "${IMAGE}:${GITHUB_SHA}"

